<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLE SCINTILLANTI - Photography Exhibition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --sidebar-bg: #030303;
            --text-main: #f0ebe1;
            --text-sub: #7a756b;
            --accent-bronze: #c5a059;
            --border-color: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #customCursor {
            position: fixed;
            width: 8px;
            height: 8px;
            background: rgba(197, 160, 89, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s, height 0.3s, background-color 0.3s;
            z-index: 99999;
            box-shadow: 0 0 12px rgba(197,160,89,0.4);
        }

        /* 顶部音乐按钮 */
        header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 2.5rem 4rem;
            z-index: 100;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        header.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .bgm-btn {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            color: var(--accent-bronze);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bgm-btn:hover {
            border-color: var(--accent-bronze);
            background: rgba(197, 160, 89, 0.1);
            box-shadow: 0 0 20px rgba(197,160,89,0.2);
        }

        /* 右下角常驻返回顶部箭头 */
        #backToTopBtn {
            position: fixed;
            bottom: 3rem;
            right: 3rem;
            width: 45px;
            height: 45px;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: var(--accent-bronze);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #backToTopBtn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #backToTopBtn:hover {
            background: rgba(197, 160, 89, 0.15);
            border-color: var(--accent-bronze);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.2);
        }

        /* 首屏海报与入场动画 */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #030303;
            background-size: cover;
            background-position: center;
            transition: background-image 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(3,3,3,0.3), rgba(11,11,11,0.95));
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            animation: heroFadeIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        .hero-subtitle {
            color: var(--text-sub);
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: var(--text-sub);
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        /* 双栏布局 */
        .main-layout {
            position: relative;
            z-index: 2;
            display: flex;
            min-height: 100vh;
        }

        /* 左侧固定索引栏 */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: #fff;
            padding: 5rem 3rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 25px 0 50px rgba(0, 0, 0, 0.95), 5px 0 15px rgba(0,0,0,0.8);
            border-right: 1px solid rgba(197, 160, 89, 0.15);
            z-index: 10;
        }

        .sidebar::-webkit-scrollbar { width: 2px; }
        .sidebar::-webkit-scrollbar-thumb { background: #222; }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .sidebar-brand {
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent-bronze);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 1.2rem;
            font-weight: 400;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-title {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .filter-item {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            background: none;
            border: none;
            text-align: left;
            padding: 0.3rem 0;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .filter-item:hover, .filter-item.active {
            color: var(--accent-bronze);
            transform: translateX(4px);
        }

        .sub-months {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding-left: 0.8rem;
            margin-top: 0.4rem;
            margin-bottom: 0.6rem;
            border-left: 1px solid #222;
            animation: subFadeIn 0.3s ease forwards;
        }

        @keyframes subFadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-btn {
            font-size: 0.7rem;
            color: var(--text-sub);
            background: none;
            border: none;
            letter-spacing: 0.1em;
            padding: 0.1rem 0.2rem;
            transition: color 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .month-btn:hover, .month-btn.active {
            color: var(--accent-bronze);
        }

        .sidebar-footer {
            font-size: 0.55rem;
            color: #444;
            letter-spacing: 0.1em;
        }

        /* 右侧展区铺满 */
        .content-area {
            flex: 1;
            padding: 5rem 6rem 12rem 7rem;
            max-width: 1700px;
            animation: contentFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes contentFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header-title {
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 400;
        }

        /* 瀑布流区 */
        .masonry-grid {
            columns: 3;
            column-gap: 2rem;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            background: transparent;
            opacity: 0;
            animation: itemFadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .masonry-item:nth-child(3n+1) { animation-delay: 0.05s; }
        .masonry-item:nth-child(3n+2) { animation-delay: 0.1s; }
        .masonry-item:nth-child(3n+3) { animation-delay: 0.15s; }

        @keyframes itemFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .masonry-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: grayscale(40%) brightness(0.7);
            transition: filter 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .masonry-item:hover .masonry-img {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.015);
        }

        /* 独立札记展厅：精确对齐时间轴与右移明信片 */
        .journals-section {
            position: relative;
            padding-left: 3rem; /* 轴线位于左侧 3rem 处 */
        }

        .journals-section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 1rem;
            bottom: 1rem;
            width: 1px;
            background-color: #2a2a2a;
        }

        .journal-card-wrapper {
            position: relative;
            margin-bottom: 10rem;
            opacity: 0;
            animation: itemFadeIn 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .timeline-dot {
            position: absolute;
            left: -3rem;
            top: 2rem;
            width: 7px;
            height: 7px;
            background-color: var(--accent-bronze);
            border-radius: 50%;
            transform: translateX(-3px); /* 水平居中咬合在竖线上 */
            box-shadow: 0 0 8px var(--accent-bronze);
            z-index: 3;
        }

        .timeline-label {
            position: absolute;
            left: -3rem; /* 放在时间轴左侧 */
            top: 2rem;
font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: var(--text-sub);
  text-align: right;
  width: auto; /* 清除固定宽度以防换行或对齐偏差 */
  font-weight: 400;

  /* 向左平移自身100%，并向下适当偏移 */
  transform: translate(calc(-100% - 8px), 8px); 
}

        /* 札记区明信片：复古泛黄边框，整体往右挪开与时间轴拉开距离，同时尺寸可以适当放大 */
        .postcard-frame {
            background-color: #f7f3ea; 
            border: 1px solid #dcd4c1;
            padding: 1.4rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 0 30px rgba(197, 160, 89, 0.05);
            width: 90%; 
            margin-left: 6rem; /* 整体往右挪，与左侧时间轴和时间标记拉开舒适的呼吸感，且照片空间更大 */
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
        }

        .postcard-frame:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 80px rgba(0,0,0,0.7);
        }

        .postcard-img-container {
            width: 100%;
            overflow: hidden;
            background: #e8e3d5;
        }

        .postcard-img-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: sepia(10%) contrast(1.05);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .postcard-frame:hover .postcard-img-container img {
            transform: scale(1.02);
        }

        .postcard-footer {
            margin-top: 1.2rem;
            padding-top: 0.9rem;
            border-top: 1px solid #e2dac7;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        /* 左下角 note 部分改为金铜色 */
        .postcard-note {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: var(--accent-bronze);
            line-height: 1.7;
            font-style: italic;
        }

        .postcard-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.3rem;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--accent-bronze);
            flex-shrink: 0;
            font-weight: 400;
        }

        .info-loc {
            color: var(--text-sub);
            font-weight: 500;
        }

        /* 灯箱大图预览 */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 3, 0.96);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 4rem;
        }

        #lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 30px 90px rgba(0,0,0,0.9);
            animation: zoomIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-animating {
            opacity: 0;
            transform: scale(0.97);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 1.5rem 1rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .lightbox-nav:hover { background: rgba(255,255,255,0.15); }
        .lightbox-prev { left: 2rem; }
        .lightbox-next { right: 2rem; }

        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #222; }
            .content-area { padding: 3rem 2rem; }
            .masonry-grid { columns: 1; }
            .postcard-frame { width: 100%; margin-left: 0; }
            .journals-section { padding-left: 1.5rem; }
            .journals-section::before { left: 0.5rem; }
            .timeline-dot { left: 0.5rem; }
            .timeline-label { left: -4.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div id="customCursor"></div>

    <header id="siteHeader">
        <button class="bgm-btn" id="bgmToggle">SOUND: Kan R. Gao - Born a Stranger</button>
    </header>

    <button id="backToTopBtn" onclick="scrollToTop()">↑</button>

    <audio id="bgmAudio" loop preload="auto">
        <source src="Kan R. Gao - Born a Stranger.mp3" type="audio/mpeg">
    </audio>

    <!-- 首屏海报 -->
    <section class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">STELLE SCINTILLANTI</h1>
            <p class="hero-subtitle">PERSONAL PHOTOGRAPHY EXHIBITION</p>
        </div>
        <div class="scroll-hint">SCROLL DOWN ↓</div>
    </section>

    <!-- 主体双栏区域 -->
    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">STELLE SCINTILLANTI</div>

                <div class="filter-group">
                    <div class="filter-title">ARCHIVES</div>
                    <button class="filter-item active" id="allWorksBtn" onclick="resetAllFilters()">All Works</button>
                    <div id="yearFilterContainer"></div>
                </div>

                <div class="filter-group" style="margin-top: 1.2rem;">
                    <div class="filter-title">LOCATIONS</div>
                    <div id="locationFilterContainer"></div>
                </div>

                <div class="filter-group" style="margin-top: 1.2rem;">
                    <div class="filter-title">EXHIBITION</div>
                    <button class="filter-item" id="journalsViewBtn" onclick="switchViewToJournals()">Journals & Notes</button>
                </div>
            </div>

            <div class="sidebar-footer">
                © 2026 STELLE SCINTILLANTI
            </div>
        </aside>

        <main class="content-area" id="contentArea">
            <!-- 动态渲染槽 -->
        </main>
    </div>

    <!-- 影院级灯箱大图预览 -->
    <div id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-nav lightbox-prev" onclick="event.stopPropagation(); changeLightboxImg(-1)">❮</button>
        <img id="lightboxImg" src="" alt="Zoomed view">
        <button class="lightbox-nav lightbox-next" onclick="event.stopPropagation(); changeLightboxImg(1)">❯</button>
    </div>

    <script>
        let allData = [];
        let selectedYear = null;
        let selectedMonth = null;
        let selectedLocation = null;
        let isJournalsView = false;
        
        let lightboxImages = [];
        let lightboxCurrentIndex = 0;

        // 点击产生优雅缓慢的微型星座连线特效
        document.addEventListener('mousedown', (e) => {
            createConstellationBurst(e.clientX, e.clientY);
        });

        function createConstellationBurst(x, y) {
            const count = 5;
            const stars = [];
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.5);
                const distance = Math.random() * 35 + 15;
                stars.push({
                    x: x + Math.cos(angle) * distance,
                    y: y + Math.sin(angle) * distance,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15,
                    size: Math.random() * 1.2 + 0.6,
                    opacity: 0.85,
                    decay: 0.008 + Math.random() * 0.005
                });
            }
            constellationBursts.push({
                stars: stars,
                life: 1.0
            });
        }

        // 滚动监听
        window.addEventListener('scroll', () => {
            const header = document.getElementById('siteHeader');
            const backToTop = document.getElementById('backToTopBtn');
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            if (scrollTop > 200) {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }

            if (scrollTop > 500) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 光标跟随
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.masonry-item') || e.target.closest('.postcard-frame') || e.target.closest('#lightbox')) {
                cursor.style.width = '26px';
                cursor.style.height = '26px';
                cursor.style.backgroundColor = 'rgba(197, 160, 89, 0.2)';
            } else {
                cursor.style.width = '8px';
                cursor.style.height = '8px';
                cursor.style.backgroundColor = 'rgba(197, 160, 89, 0.9)';
            }
        });

        // 背景粒子与星座连线系统
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let ambientParticles = [];
        let constellationBursts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class AmbientParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.2;
                this.speedX = Math.random() * 0.12 - 0.06;
                this.speedY = Math.random() * 0.12 - 0.06;
                this.opacity = Math.random() * 0.3 + 0.05;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(197, 160, 89, ${this.opacity})`;
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }

        for (let i = 0; i < 30; i++) ambientParticles.push(new AmbientParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ambientParticles.forEach(p => {
                p.update();
                p.draw();
            });

            for (let i = constellationBursts.length - 1; i >= 0; i--) {
                let burst = constellationBursts[i];
                let stars = burst.stars;

                stars.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.opacity -= s.decay;
                });

                if (stars[0].opacity <= 0) {
                    constellationBursts.splice(i, 1);
                    continue;
                }

                ctx.strokeStyle = `rgba(197, 160, 89, ${stars[0].opacity * 0.35})`;
                ctx.lineWidth = 0.6;
                ctx.beginPath();
                for (let j = 0; j < stars.length; j++) {
                    for (let k = j + 1; k < stars.length; k++) {
                        let dx = stars[j].x - stars[k].x;
                        let dy = stars[j].y - stars[k].y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 55) {
                            ctx.moveTo(stars[j].x, stars[j].y);
                            ctx.lineTo(stars[k].x, stars[k].y);
                        }
                    }
                }
                ctx.stroke();

                stars.forEach(s => {
                    ctx.fillStyle = `rgba(197, 160, 89, ${s.opacity})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        async function initGallery() {
            try {
                const res = await fetch('data.json');
                allData = await res.json();

                const journalPool = allData.filter(item => item.journal);
                if (journalPool.length > 0) {
                    const heroPhoto = journalPool[Math.floor(Math.random() * journalPool.length)];
                    document.getElementById('heroSection').style.backgroundImage = `url('${heroPhoto.url}')`;
                }

                buildSidebarFilters();
                renderContent();
            } catch (err) {
                console.error("加载数据失败:", err);
            }
        }

        function buildSidebarFilters() {
            const yearMap = {};
            const locations = new Set();

            allData.forEach(item => {
                const y = item.year || item.date.split('.')[0];
                const m = item.month || item.date.split('.')[1] || '01';
                if (!yearMap[y]) yearMap[y] = new Set();
                yearMap[y].add(m);

                if (item.location) locations.add(item.location);
            });

            const yearContainer = document.getElementById('yearFilterContainer');
            yearContainer.innerHTML = '';
            Object.keys(yearMap).sort().reverse().forEach(year => {
                const wrapper = document.createElement('div');
                const yBtn = document.createElement('button');
                yBtn.className = 'filter-item year-btn-' + year;
                yBtn.innerText = year;
                yBtn.onclick = () => toggleYear(year, Array.from(yearMap[year]).sort(), wrapper);
                wrapper.appendChild(yBtn);
                yearContainer.appendChild(wrapper);
            });

            const locContainer = document.getElementById('locationFilterContainer');
            locContainer.innerHTML = '';
            locations.forEach(loc => {
                const lBtn = document.createElement('button');
                lBtn.className = 'filter-item loc-btn';
                lBtn.style.display = 'block';
                lBtn.style.width = '100%';
                lBtn.innerText = loc;
                lBtn.onclick = () => {
                    isJournalsView = false;
                    document.getElementById('journalsViewBtn').classList.remove('active');
                    document.getElementById('allWorksBtn').classList.remove('active');

                    if (selectedLocation === loc) {
                        selectedLocation = null;
                        lBtn.classList.remove('active');
                    } else {
                        document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
                        selectedLocation = loc;
                        lBtn.classList.add('active');
                    }
                    renderContentWithAnim();
                };
                locContainer.appendChild(lBtn);
            });
        }

        function toggleYear(year, months, wrapperElement) {
            isJournalsView = false;
            document.getElementById('journalsViewBtn').classList.remove('active');
            document.getElementById('allWorksBtn').classList.remove('active');

            if (selectedYear === year) {
                selectedYear = null;
                selectedMonth = null;
                wrapperElement.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
                const sub = wrapperElement.querySelector('.sub-months');
                if (sub) sub.remove();
                renderContentWithAnim();
                return;
            }

            document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());

            selectedYear = year;
            selectedMonth = null;
            wrapperElement.querySelector('.filter-item').classList.add('active');

            const subDiv = document.createElement('div');
            subDiv.className = 'sub-months';

            months.forEach(m => {
                const mBtn = document.createElement('button');
                mBtn.className = 'month-btn';
                mBtn.innerText = m;
                mBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedMonth === m) {
                        selectedMonth = null;
                        mBtn.classList.remove('active');
                    } else {
                        document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                        selectedMonth = m;
                        mBtn.classList.add('active');
                    }
                    renderContentWithAnim();
                };
                subDiv.appendChild(mBtn);
            });

            wrapperElement.appendChild(subDiv);
            renderContentWithAnim();
        }

        function resetAllFilters() {
            isJournalsView = false;
            selectedYear = null;
            selectedMonth = null;
            selectedLocation = null;

            document.querySelectorAll('.filter-item, .month-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());
            document.getElementById('allWorksBtn').classList.add('active');
            renderContentWithAnim();
        }

        function switchViewToJournals() {
            isJournalsView = true;
            document.querySelectorAll('.filter-item, .month-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());
            document.getElementById('journalsViewBtn').classList.add('active');
            renderContentWithAnim();
        }

        function renderContentWithAnim() {
            const container = document.getElementById('contentArea');
            container.style.animation = 'none';
            container.offsetHeight; 
            container.style.animation = 'contentFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards';
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('contentArea');
            container.innerHTML = '';

            if (isJournalsView) {
                renderJournalsView(container);
                return;
            }

            let filteredData = allData;
            let titleText = "ALL ARCHIVES";

            if (selectedYear) {
                filteredData = filteredData.filter(item => (item.year || item.date.split('.')[0]) === selectedYear);
                titleText = `CHRONOLOGY: ${selectedYear}`;
            }
            if (selectedMonth) {
                filteredData = filteredData.filter(item => {
                    const m = item.month || item.date.split('.')[1];
                    return m === selectedMonth;
                });
                titleText = `PERIOD: ${selectedYear}.${selectedMonth}`;
            }

            if (selectedLocation) {
                filteredData = filteredData.filter(item => item.location === selectedLocation);
                titleText += ` / LOCATION: ${selectedLocation}`;
            }

            lightboxImages = filteredData.map(i => i.url);

            const headerDiv = document.createElement('div');
            headerDiv.className = 'section-header-title';
            headerDiv.innerHTML = `<span>${titleText}</span><span>${filteredData.length} items</span>`;
            container.appendChild(headerDiv);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'masonry-grid';

            filteredData.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'masonry-item';
                itemDiv.innerHTML = `
                    <img src="${item.url}" alt="${item.location}" class="masonry-img" onclick="openLightbox(${index})">
                `;
                gridDiv.appendChild(itemDiv);
            });
            container.appendChild(gridDiv);
        }

        function renderJournalsView(container) {
            const journalData = allData.filter(item => item.journal);
            lightboxImages = journalData.map(i => i.url);

            const headerDiv = document.createElement('div');
            headerDiv.className = 'section-header-title';
            headerDiv.innerHTML = `<span>JOURNALS & NOTES COLLECTION</span><span>${journalData.length} entries</span>`;
            container.appendChild(headerDiv);

            const section = document.createElement('section');
            section.className = 'journals-section';

            let lastDate = null;

            journalData.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'journal-card-wrapper';
                
                let showDateLabel = (item.date !== lastDate);
                lastDate = item.date;

                let timeLabelHtml = showDateLabel ? `<div class="timeline-label">${item.date}</div>` : '';
                let dotHtml = showDateLabel ? `<div class="timeline-dot"></div>` : '';
                let noteHtml = item.note ? `<p class="postcard-note">"${item.note}"</p>` : '';

                wrapper.innerHTML = `
                    ${dotHtml}
                    ${timeLabelHtml}
                    <div class="postcard-frame">
                        <div class="postcard-img-container">
                            <img src="${item.url}" alt="${item.location}" onclick="openLightbox(${index})">
                        </div>
                        <div class="postcard-footer" ${!item.note ? 'style="border-top:none; margin-top:0.8rem;"' : ''}>
                            ${noteHtml}
                            <div class="postcard-info">
                                <span class="info-loc">${item.location}</span>
                                <span>${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
                section.appendChild(wrapper);
            });
            container.appendChild(section);
        }

        function openLightbox(index) {
            lightboxCurrentIndex = index;
            const box = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = lightboxImages[lightboxCurrentIndex];
            box.style.display = 'flex';
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                document.getElementById('lightbox').style.display = 'none';
            }
        }

        function changeLightboxImg(direction) {
            const img = document.getElementById('lightboxImg');
            img.classList.add('lightbox-animating');

            setTimeout(() => {
                lightboxCurrentIndex += direction;
                if (lightboxCurrentIndex < 0) lightboxCurrentIndex = lightboxImages.length - 1;
                if (lightboxCurrentIndex >= lightboxImages.length) lightboxCurrentIndex = 0;
                img.src = lightboxImages[lightboxCurrentIndex];
                
                setTimeout(() => {
                    img.classList.remove('lightbox-animating');
                }, 50);
            }, 200);
        }

        document.addEventListener('keydown', (e) => {
            const box = document.getElementById('lightbox');
            if (box.style.display === 'flex') {
                if (e.key === 'ArrowLeft') changeLightboxImg(-1);
                if (e.key === 'ArrowRight') changeLightboxImg(1);
                if (e.key === 'Escape') box.style.display = 'none';
            }
        });

        document.getElementById('lightbox').addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0) {
                changeLightboxImg(1);
            } else {
                changeLightboxImg(-1);
            }
        }, { passive: false });

        const audio = document.getElementById('bgmAudio');
        const bgmToggle = document.getElementById('bgmToggle');
        if (audio && bgmToggle) {
            audio.volume = 0.35;
            bgmToggle.onclick = () => {
                if (audio.paused) {
                    audio.play().then(() => {
                        bgmToggle.innerText = "SOUND: ON [Kan R. Gao - Born a Stranger]";
                    }).catch(e => console.error(e));
                } else {
                    audio.pause();
                    bgmToggle.innerText = "SOUND: Kan R. Gao - Born a Stranger";
                }
            };
        }

        window.onload = initGallery;
    </script>
</body>
</html>
