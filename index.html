<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLE SCINTILLANTI</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-main: #1a1a1a;
            --text-sub: #8c867a;
            --card-bg: #ffffff;
            --border-color: #e5e2db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Cinzel", "Times New Roman", "Songti SC", serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 尘埃微粒 Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 自定义光标 */
        #customCursor {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #1a1a1a;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out, width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 9999;
            mix-blend-mode: difference;
        }

        /* 顶部导航与 BGM */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
            color: #fff;
        }

        .brand-logo {
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .bgm-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            color: #fff;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
        }

        .bgm-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 1. 首页全屏海报 Hero 区域 */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
            z-index: 2;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
        }

        .hero-title {
            position: relative;
            z-index: 3;
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.35em;
            text-align: center;
            text-transform: uppercase;
            padding: 0 2rem;
        }

        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        /* 2. 主展示区 (明信片风格画廊) */
        main {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1600px;
            margin: 6rem auto 10rem auto;
            padding: 0 4rem;
        }

        .section-header {
            margin-bottom: 5rem;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* 明信片单图大卡片：右侧占 80% */
        .postcard-item {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-bottom: 12rem;
            position: relative;
        }

        /* 极细边框与衬纸感容器 */
        .postcard-frame {
            width: 82%; /* 占用右侧大比例版面 */
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
            position: relative;
            transition: transform 0.5s ease;
        }

        .postcard-frame:hover {
            transform: translateY(-4px);
        }

        .postcard-img-wrapper {
            width: 100%;
            overflow: hidden;
            background-color: #f0eee9;
        }

        .postcard-img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .postcard-frame:hover .postcard-img-wrapper img {
            transform: scale(1.02);
        }

        /* 左下角/边角极简时间与地点信息 */
        .postcard-meta {
            position: absolute;
            left: -18%; /* 浮动在照片左侧空白处 */
            bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--text-sub);
            text-transform: uppercase;
            text-align: right;
            width: 15%;
        }

        .meta-location {
            color: var(--text-main);
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            header { padding: 1.5rem 2rem; }
            .hero-title { font-size: 2rem; }
            main { padding: 0 1.5rem; }
            .postcard-item { flex-direction: column; }
            .postcard-frame { width: 100%; }
            .postcard-meta {
                position: relative;
                left: 0;
                width: 100%;
                text-align: left;
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div id="customCursor"></div>

    <header>
        <div class="brand-logo">STELLE SCINTILLANTI</div>
        <button class="bgm-btn" id="bgmToggle">SOUND: OFF</button>
    </header>

    <audio id="bgmAudio" loop preload="auto">
        <source src="Kan R. Gao - Born a Stranger.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. 首页全屏海报 -->
    <section class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        <h1 class="hero-title">STELLE SCINTILLANTI</h1>
        <div class="scroll-hint">SCROLL TO EXPLORE</div>
    </section>

    <!-- 2. 照片索引列表 -->
    <main>
        <div class="section-header">01 / POSTCARDS & JOURNEY</div>
        <section id="galleryContainer"></section>
    </main>

    <script>
        // 光标跟随
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.postcard-frame')) {
                cursor.style.width = '24px';
                cursor.style.height = '24px';
                cursor.style.backgroundColor = 'rgba(0,0,0,0.2)';
            } else {
                cursor.style.width = '8px';
                cursor.style.height = '8px';
                cursor.style.backgroundColor = '#1a1a1a';
            }
        });

        // 背景微粒
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.3;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(150, 140, 130, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 加载数据并渲染
        async function loadGallery() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();

                // 随机设置 Hero 区域大图背景
                if (data.length > 0) {
                    const randomPhoto = data[Math.floor(Math.random() * data.length)];
                    document.getElementById('heroSection').style.backgroundImage = `url('${randomPhoto.url}')`;
                }

                // 渲染右侧明信片画廊
                const container = document.getElementById('galleryContainer');
                container.innerHTML = '';

                data.forEach(item => {
                    const article = document.createElement('article');
                    article.className = 'postcard-item';
                    article.innerHTML = `
                        <div class="postcard-meta">
                            <span class="meta-location">${item.location}</span>
                            <span class="meta-date">${item.date}</span>
                        </div>
                        <div class="postcard-frame">
                            <div class="postcard-img-wrapper">
                                <img src="${item.url}" alt="${item.location}" loading="lazy">
                            </div>
                        </div>
                    `;
                    container.appendChild(article);
                });

            } catch (err) {
                console.error("数据读取失败:", err);
            }
        }

        // BGM 控制
        const audio = document.getElementById('bgmAudio');
        const bgmToggle = document.getElementById('bgmToggle');
        if (audio && bgmToggle) {
            audio.volume = 0.35;
            bgmToggle.onclick = () => {
                if (audio.paused) {
                    audio.play().then(() => {
                        bgmToggle.innerText = "SOUND: ON";
                    }).catch(e => console.error(e));
                } else {
                    audio.pause();
                    bgmToggle.innerText = "SOUND: OFF";
                }
            };
        }

        window.onload = loadGallery;
    </script>
</body>
</html>
