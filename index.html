<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLE SCINTILLANTI - Photography Exhibition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --sidebar-bg: #050505;
            --text-main: #f0ebe1;
            --text-sub: #7a756b;
            --accent-bronze: #c5a059;
            --border-color: #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #customCursor {
            position: fixed;
            width: 8px;
            height: 8px;
            background: rgba(197, 160, 89, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s, height 0.3s, background-color 0.3s;
            z-index: 9999;
            box-shadow: 0 0 12px rgba(197,160,89,0.4);
        }

        /* 顶部音乐按钮（滚动后自动淡出隐藏） */
        header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 2.5rem 4rem;
            z-index: 100;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        header.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .bgm-btn {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            color: var(--accent-bronze);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bgm-btn:hover {
            border-color: var(--accent-bronze);
            background: rgba(197, 160, 89, 0.1);
            box-shadow: 0 0 20px rgba(197,160,89,0.2);
        }

        /* 首屏全屏海报 */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-size: cover;
            background-position: center;
            transition: background-image 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.3), rgba(11,11,11,0.95));
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            animation: fadeInDown 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hero-title {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        .hero-subtitle {
            color: var(--text-sub);
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: var(--text-sub);
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 双栏布局 */
        .main-layout {
            position: relative;
            z-index: 2;
            display: flex;
            min-height: 100vh;
        }

        /* 左侧固定索引栏与阴影边界 */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: #fff;
            padding: 5rem 3rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 15px 0 35px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .sidebar::-webkit-scrollbar { width: 2px; }
        .sidebar::-webkit-scrollbar-thumb { background: #222; }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        /* 金铜色高定名字 */
        .sidebar-brand {
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent-bronze);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 1.2rem;
            font-weight: 400;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .filter-title {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .filter-item {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            background: none;
            border: none;
            text-align: left;
            padding: 0.3rem 0;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .filter-item:hover, .filter-item.active {
            color: #fff;
            transform: translateX(4px);
        }

        /* 年份展开后的月份样式：纯数字 01 02 */
        .sub-months {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding-left: 0.8rem;
            margin-top: 0.4rem;
            margin-bottom: 0.6rem;
            border-left: 1px solid #222;
        }

        .month-btn {
            font-size: 0.7rem;
            color: var(--text-sub);
            background: none;
            border: none;
            letter-spacing: 0.1em;
            padding: 0.1rem 0.2rem;
            transition: color 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .month-btn:hover, .month-btn.active {
            color: var(--accent-bronze);
        }

        .sidebar-footer {
            font-size: 0.55rem;
            color: #444;
            letter-spacing: 0.1em;
        }

        /* 右侧展区铺满 */
        .content-area {
            flex: 1;
            padding: 5rem 5rem 10rem 6rem;
            max-width: 1600px;
            animation: fadeIn 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header-title {
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 400;
        }

        /* 更有错落感的瀑布流容器 */
        .masonry-grid {
            columns: 2;
            column-gap: 3.5rem;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 3.5rem;
            background: #141414;
            padding: 0;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
        }

        /* 游标未滑到时的低饱和度/暗调沉浸效果 */
        .masonry-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: grayscale(40%) brightness(0.65) contrast(0.95);
            transition: filter 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s ease;
        }

        .masonry-item:hover .masonry-img {
            filter: grayscale(0%) brightness(1) contrast(1);
            transform: scale(1.01);
        }

        .masonry-item:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .masonry-meta {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            padding: 0 0.2rem;
        }

        /* 札记 (Journals) 独立展厅区 */
        .journals-section {
            position: relative;
            padding-left: 3.5rem;
        }

        .journals-section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 1rem;
            bottom: 1rem;
            width: 1px;
            background-color: #222;
        }

        .journal-card-wrapper {
            position: relative;
            margin-bottom: 9rem;
        }

        /* 时间轴圆点 */
        .timeline-dot {
            position: absolute;
            left: -3.5rem;
            top: 1.5rem;
            width: 7px;
            height: 7px;
            background-color: var(--accent-bronze);
            border-radius: 50%;
            transform: translateX(-3px);
            box-shadow: 0 0 8px var(--accent-bronze);
        }

        /* 时间文字在圆点左下角横向显示，不压线 */
        .timeline-label {
            position: absolute;
            left: -6.5rem;
            top: 2.5rem;
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            white-space: nowrap;
        }

        /* 札记卡片 */
        .postcard-frame {
            background-color: #121212;
            border: 1px solid #222;
            padding: 1.2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            width: 85%;
            margin-left: auto;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .postcard-frame:hover {
            transform: translateY(-4px);
            border-color: #333;
        }

        .postcard-img-container {
            width: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }

        .postcard-img-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: grayscale(30%) brightness(0.7);
            transition: filter 0.6s ease;
        }

        .postcard-frame:hover .postcard-img-container img {
            filter: grayscale(0%) brightness(1);
        }

        .postcard-footer {
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid #1c1c1c;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        .postcard-note {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: #b5ada0;
            line-height: 1.6;
            font-style: italic;
        }

        .postcard-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.3rem;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .info-loc {
            color: var(--text-main);
            font-weight: 500;
        }

        /* 灯箱大图预览与连续切换控件 */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 4rem;
        }

        #lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            animation: zoomIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 1.5rem 1rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .lightbox-nav:hover { background: rgba(255,255,255,0.15); }
        .lightbox-prev { left: 2rem; }
        .lightbox-next { right: 2rem; }

        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; box-shadow: none; border-bottom: 1px solid #222; }
            .content-area { padding: 3rem 2rem; }
            .masonry-grid { columns: 1; }
            .postcard-frame { width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div id="customCursor"></div>

    <header id="siteHeader">
        <button class="bgm-btn" id="bgmToggle">SOUND: Kan R. Gao - Born a Stranger</button>
    </header>

    <audio id="bgmAudio" loop preload="auto">
        <source src="Kan R. Gao - Born a Stranger.mp3" type="audio/mpeg">
    </audio>

    <!-- 首屏海报 -->
    <section class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">STELLE SCINTILLANTI</h1>
            <p class="hero-subtitle">PERSONAL PHOTOGRAPHY EXHIBITION</p>
        </div>
        <div class="scroll-hint">SCROLL DOWN ↓</div>
    </section>

    <!-- 主体双栏区域 -->
    <div class="main-layout">
        <!-- 左侧索引栏 -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">STELLE SCINTILLANTI</div>

                <div class="filter-group">
                    <div class="filter-title">ARCHIVES</div>
                    <button class="filter-item active" onclick="switchView('all')">All Works</button>
                    <div id="yearFilterContainer"></div>
                </div>

                <div class="filter-group" style="margin-top: 1.2rem;">
                    <div class="filter-title">LOCATIONS</div>
                    <div id="locationFilterContainer"></div>
                </div>

                <div class="filter-group" style="margin-top: 1.2rem;">
                    <div class="filter-title">EXHIBITION</div>
                    <button class="filter-item" onclick="switchView('journals')">Journals & Notes</button>
                </div>
            </div>

            <div class="sidebar-footer">
                © 2026 STELLE SCINTILLANTI
            </div>
        </aside>

        <!-- 右侧动态内容展厅 -->
        <main class="content-area" id="contentArea">
            <!-- 动态渲染槽 -->
        </main>
    </div>

    <!-- 影院级灯箱大图预览 -->
    <div id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-nav lightbox-prev" onclick="event.stopPropagation(); changeLightboxImg(-1)">❮</button>
        <img id="lightboxImg" src="" alt="Zoomed view">
        <button class="lightbox-nav lightbox-next" onclick="event.stopPropagation(); changeLightboxImg(1)">❯</button>
    </div>

    <script>
        let allData = [];
        let currentViewMode = 'all'; // 'all', 'year', 'month', 'location', 'journals'
        let currentFilterParam = null;
        let currentSubParam = null;
        
        let lightboxImages = [];
        let lightboxCurrentIndex = 0;

        // 滚动时隐藏/显示 BGM 按钮
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const header = document.getElementById('siteHeader');
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > 200) {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }
        });

        // 光标交互
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.masonry-item') || e.target.closest('.postcard-frame')) {
                cursor.style.width = '26px';
                cursor.style.height = '26px';
                cursor.style.backgroundColor = 'rgba(197, 160, 89, 0.2)';
            } else {
                cursor.style.width = '8px';
                cursor.style.height = '8px';
                cursor.style.backgroundColor = 'rgba(197, 160, 89, 0.9)';
            }
        });

        // 粒子背景
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.2;
                this.speedX = Math.random() * 0.15 - 0.07;
                this.speedY = Math.random() * 0.15 - 0.07;
                this.opacity = Math.random() * 0.3 + 0.05;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(197, 160, 89, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 30; i++) particles.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 初始化加载数据
        async function initGallery() {
            try {
                const res = await fetch('data.json');
                allData = await res.json();

                const journalPool = allData.filter(item => item.journal);
                if (journalPool.length > 0) {
                    const heroPhoto = journalPool[Math.floor(Math.random() * journalPool.length)];
                    document.getElementById('heroSection').style.backgroundImage = `url('${heroPhoto.url}')`;
                }

                buildSidebarFilters();
                renderContent();
            } catch (err) {
                console.error("加载数据失败:", err);
            }
        }

        // 构建侧边栏双重索引
        function buildSidebarFilters() {
            const yearMap = {};
            const locations = new Set();

            allData.forEach(item => {
                const y = item.year || item.date.split('.')[0];
                const m = item.month || item.date.split('.')[1] || '01';
                if (!yearMap[y]) yearMap[y] = new Set();
                yearMap[y].add(m);

                if (item.location) locations.add(item.location);
            });

            // 年份渲染
            const yearContainer = document.getElementById('yearFilterContainer');
            yearContainer.innerHTML = '';
            Object.keys(yearMap).sort().reverse().forEach(year => {
                const wrapper = document.createElement('div');
                const yBtn = document.createElement('button');
                yBtn.className = 'filter-item';
                yBtn.innerText = year;
                yBtn.onclick = () => toggleYearMenu(year, Array.from(yearMap[year]).sort(), wrapper);
                wrapper.appendChild(yBtn);
                yearContainer.appendChild(wrapper);
            });

            // 地点渲染（独立一行）
            const locContainer = document.getElementById('locationFilterContainer');
            locContainer.innerHTML = '';
            locations.forEach(loc => {
                const lBtn = document.createElement('button');
                lBtn.className = 'filter-item';
                lBtn.style.display = 'block';
                lBtn.style.width = '100%';
                lBtn.innerText = loc;
                lBtn.onclick = () => {
                    document.querySelectorAll('.filter-item, .month-btn').forEach(el => el.classList.remove('active'));
                    lBtn.classList.add('active');
                    currentViewMode = 'location';
                    currentFilterParam = loc;
                    currentSubParam = null;
                    renderContent();
                };
                locContainer.appendChild(lBtn);
            });
        }

        function toggleYearMenu(year, months, wrapperElement) {
            document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());

            event.target.classList.add('active');
            currentViewMode = 'year';
            currentFilterParam = year;
            currentSubParam = null;

            const subDiv = document.createElement('div');
            subDiv.className = 'sub-months';

            months.forEach(m => {
                const mBtn = document.createElement('button');
                mBtn.className = 'month-btn';
                mBtn.innerText = m; // 直接显示 01, 02 不带年份
                mBtn.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                    mBtn.classList.add('active');
                    currentViewMode = 'month';
                    currentSubParam = m;
                    renderContent();
                };
                subDiv.appendChild(mBtn);
            });

            wrapperElement.appendChild(subDiv);
            renderContent();
        }

        function switchView(mode) {
            document.querySelectorAll('.filter-item, .month-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());
            event.target.classList.add('active');

            currentViewMode = mode;
            currentFilterParam = null;
            currentSubParam = null;
            renderContent();
        }

        // 根据当前状态核心渲染右侧
        function renderContent() {
            const container = document.getElementById('contentArea');
            container.innerHTML = '';

            let filteredData = allData;
            let titleText = "ALL ARCHIVES";

            if (currentViewMode === 'year') {
                filteredData = allData.filter(item => (item.year || item.date.split('.')[0]) === currentFilterParam);
                titleText = `CHRONOLOGY: ${currentFilterParam}`;
            } else if (currentViewMode === 'month') {
                filteredData = allData.filter(item => {
                    const y = item.year || item.date.split('.')[0];
                    const m = item.month || item.date.split('.')[1];
                    return y === currentFilterParam && m === currentSubParam;
                });
                titleText = `PERIOD: ${currentFilterParam}.${currentSubParam}`;
            } else if (currentViewMode === 'location') {
                filteredData = allData.filter(item => item.location === currentFilterParam);
                titleText = `LOCATION: ${currentFilterParam}`;
            } else if (currentViewMode === 'journals') {
                renderJournalsView(container);
                return;
            }

            // 渲染瀑布流视窗
            lightboxImages = filteredData.map(i => i.url);
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'section-header-title';
            headerDiv.innerHTML = `<span>${titleText}</span><span>${filteredData.length} items</span>`;
            container.appendChild(headerDiv);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'masonry-grid';

            filteredData.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'masonry-item';
                itemDiv.innerHTML = `
                    <img src="${item.url}" alt="${item.location}" class="masonry-img" onclick="openLightbox(${index})">
                    <div class="masonry-meta">
                        <span>${item.location}</span>
                        <span>${item.date}</span>
                    </div>
                `;
                gridDiv.appendChild(itemDiv);
            });
            container.appendChild(gridDiv);
        }

        // 渲染独立札记展厅
        function renderJournalsView(container) {
            const journalData = allData.filter(item => item.journal);
            lightboxImages = journalData.map(i => i.url);

            const headerDiv = document.createElement('div');
            headerDiv.className = 'section-header-title';
            headerDiv.innerHTML = `<span>JOURNALS & NOTES COLLECTION</span><span>${journalData.length} entries</span>`;
            container.appendChild(headerDiv);

            const section = document.createElement('section');
            section.className = 'journals-section';

            journalData.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'journal-card-wrapper';
                
                let noteHtml = item.note ? `<p class="postcard-note">"${item.note}"</p>` : '';

                wrapper.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="timeline-label">${item.date}</div>
                    <div class="postcard-frame">
                        <div class="postcard-img-container">
                            <img src="${item.url}" alt="${item.location}" onclick="openLightbox(${index})">
                        </div>
                        <div class="postcard-footer" ${!item.note ? 'style="border-top:none; margin-top:0.8rem;"' : ''}>
                            ${noteHtml}
                            <div class="postcard-info">
                                <span class="info-loc">${item.location}</span>
                                <span>${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
                section.appendChild(wrapper);
            });
            container.appendChild(section);
        }

        // 灯箱大图多图连续浏览逻辑
        function openLightbox(index) {
            lightboxCurrentIndex = index;
            const box = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = lightboxImages[lightboxCurrentIndex];
            box.style.display = 'flex';
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                document.getElementById('lightbox').style.display = 'none';
            }
        }

        function changeLightboxImg(direction) {
            lightboxCurrentIndex += direction;
            if (lightboxCurrentIndex < 0) lightboxCurrentIndex = lightboxImages.length - 1;
            if (lightboxCurrentIndex >= lightboxImages.length) lightboxCurrentIndex = 0;
            document.getElementById('lightboxImg').src = lightboxImages[lightboxCurrentIndex];
        }

        // 键盘左右键切换大图
        document.addEventListener('keydown', (e) => {
            const box = document.getElementById('lightbox');
            if (box.style.display === 'flex') {
                if (e.key === 'ArrowLeft') changeLightboxImg(-1);
                if (e.key === 'ArrowRight') changeLightboxImg(1);
                if (e.key === 'Escape') box.style.display = 'none';
            }
        });

        // BGM 控制
        const audio = document.getElementById('bgmAudio');
        const bgmToggle = document.getElementById('bgmToggle');
        if (audio && bgmToggle) {
            audio.volume = 0.35;
            bgmToggle.onclick = () => {
                if (audio.paused) {
                    audio.play().then(() => {
                        bgmToggle.innerText = "SOUND: ON [Kan R. Gao - Born a Stranger]";
                    }).catch(e => console.error(e));
                } else {
                    audio.pause();
                    bgmToggle.innerText = "SOUND: Kan R. Gao - Born a Stranger";
                }
            };
        }

        window.onload = initGallery;
    </script>
</body>
</html>
