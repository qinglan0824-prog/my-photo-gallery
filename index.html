<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLE SCINTILLANTI - Photography Exhibition</title>
    <!-- 引入高奢感现代无衬线字体 Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f6f2;
            --sidebar-bg: #0d0d0d;
            --text-main: #1a1a1a;
            --text-sub: #8c867a;
            --card-bg: #ffffff;
            --border-color: #e2dfd8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 优化自定义光标，确保在黑白背景下都清晰可见 */
        #customCursor {
            position: fixed;
            width: 10px;
            height: 10px;
            background: rgba(247, 246, 242, 0.9);
            border: 1px solid rgba(26, 26, 26, 0.4);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        /* 顶部导航 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 100;
        }

        .bgm-btn {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1.4rem;
            border-radius: 30px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
        }

        .bgm-btn:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
        }

        /* 1. 首屏全屏海报 */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0d0d0d;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
            z-index: 2;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .hero-title {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        .hero-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -6px); }
            60% { transform: translate(-50%, -3px); }
        }

        /* 2. 主体双栏布局 */
        .main-layout {
            position: relative;
            z-index: 2;
            display: flex;
            min-height: 100vh;
        }

        /* 左侧黑底索引栏 */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: #fff;
            padding: 5rem 2.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: #333; }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .sidebar-brand {
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #fff;
            border-bottom: 1px solid #222;
            padding-bottom: 1rem;
            font-weight: 300;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .filter-title {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .filter-item {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: #999;
            background: none;
            border: none;
            text-align: left;
            padding: 0.2rem 0;
            transition: color 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .filter-item:hover, .filter-item.active {
            color: #fff;
        }

        .sub-months {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-left: 0.8rem;
            margin-top: 0.4rem;
            margin-bottom: 0.6rem;
            border-left: 1px solid #333;
        }

        .month-btn {
            font-size: 0.7rem;
            color: #666;
            background: none;
            border: none;
            letter-spacing: 0.1em;
            padding: 0.1rem 0.3rem;
            transition: color 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .month-btn:hover, .month-btn.active {
            color: #fff;
        }

        .sidebar-footer {
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 0.1em;
        }

        /* 右侧展示内容区 */
        .content-area {
            flex: 1;
            padding: 5rem 6rem;
            max-width: 1400px;
        }

        .section-header-title {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 400;
        }

        /* 瀑布流结果区 */
        .masonry-grid {
            columns: 2;
            column-gap: 3rem;
            margin-bottom: 8rem;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 3rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            transition: transform 0.4s ease;
        }

        .masonry-item:hover {
            transform: translateY(-3px);
        }

        .masonry-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .masonry-meta {
            margin-top: 0.8rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
        }

        /* 札记 (Journals) 区 */
        .journals-section {
            position: relative;
            padding-left: 3rem;
        }

        .journals-section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 1rem;
            bottom: 1rem;
            width: 1px;
            background-color: var(--border-color);
        }

        .journal-card-wrapper {
            position: relative;
            margin-bottom: 10rem;
        }

        .timeline-dot {
            position: absolute;
            left: -3rem;
            top: 2rem;
            width: 7px;
            height: 7px;
            background-color: var(--text-main);
            border-radius: 50%;
            transform: translateX(-3px);
        }

        .timeline-label {
            position: absolute;
            left: -3rem;
            top: 2.8rem;
            transform: translateX(-50%) rotate(-90deg);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .postcard-frame {
            background-color: var(--card-bg);
            border: 1px solid #1a1a1a;
            padding: 1rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.03);
            width: 90%;
            margin-left: auto;
            transition: transform 0.5s ease;
        }

        .postcard-frame:hover {
            transform: translateY(-4px);
        }

        .postcard-img-container {
            width: 100%;
            overflow: hidden;
            background: #eee;
        }

        .postcard-img-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .postcard-footer {
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        .postcard-note {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: #444;
            line-height: 1.6;
            font-style: italic;
        }

        .postcard-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.3rem;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .info-loc {
            color: var(--text-main);
            font-weight: 500;
        }

        /* 灯箱大图预览 */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 3rem;
        }

        #lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: 1px solid #333;
        }

        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .content-area { padding: 3rem 2rem; }
            .masonry-grid { columns: 1; }
            .postcard-frame { width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div id="customCursor"></div>

    <header>
        <button class="bgm-btn" id="bgmToggle">SOUND: Kan R. Gao - Born a Stranger</button>
    </header>

    <audio id="bgmAudio" loop preload="auto">
        <source src="Kan R. Gao - Born a Stranger.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. 首屏全屏海报 -->
    <section class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">STELLE SCINTILLANTI</h1>
            <p class="hero-subtitle">PERSONAL PHOTOGRAPHY EXHIBITION</p>
        </div>
        <div class="scroll-hint">SCROLL DOWN ↓</div>
    </section>

    <!-- 2. 主体双栏区域 -->
    <div class="main-layout">
        <!-- 左侧黑底索引栏 -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">STELLE SCINTILLANTI</div>

                <div class="filter-group">
                    <div class="filter-title">CHRONOLOGY</div>
                    <button class="filter-item active" onclick="filterAll()">All Archives</button>
                    <div id="yearFilterContainer"></div>
                </div>

                <div class="filter-group" style="margin-top: 1rem;">
                    <div class="filter-title">LOCATIONS</div>
                    <div id="locationFilterContainer"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                © 2026 STELLE SCINTILLANTI
            </div>
        </aside>

        <!-- 右侧内容动态呈现区 -->
        <main class="content-area">
            <div id="dynamicView">
                <div class="section-header-title">
                    <span id="viewTitle">ARCHIVE COLLECTION</span>
                    <span id="viewCount">0 items</span>
                </div>
                <div class="masonry-grid" id="masonryContainer"></div>

                <div class="section-header-title" style="margin-top: 8rem;">
                    <span>JOURNALS & NOTES</span>
                </div>
                <section class="journals-section" id="journalsContainer"></section>
            </div>
        </main>
    </div>

    <!-- 灯箱大图预览 -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Zoomed view">
    </div>

    <script>
        let allData = [];
        let activeYear = null;

        // 光标跟随
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.masonry-item') || e.target.closest('.postcard-frame')) {
                cursor.style.width = '24px';
                cursor.style.height = '24px';
                cursor.style.backgroundColor = 'rgba(255,255,255,0.3)';
            } else {
                cursor.style.width = '10px';
                cursor.style.height = '10px';
                cursor.style.backgroundColor = 'rgba(247, 246, 242, 0.9)';
            }
        });

        // 背景微粒
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.3;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.speedY = Math.random() * 0.2 - 0.1;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(150, 140, 130, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 35; i++) particles.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 加载数据与渲染
        async function initGallery() {
            try {
                const res = await fetch('data.json');
                allData = await res.json();

                const journalPool = allData.filter(item => item.journal);
                const randomPool = journalPool.length > 0 ? journalPool : allData;
                if (randomPool.length > 0) {
                    const heroPhoto = randomPool[Math.floor(Math.random() * randomPool.length)];
                    document.getElementById('heroSection').style.backgroundImage = `url('${heroPhoto.url}')`;
                }

                buildSidebarFilters();
                renderMasonry(allData, "ALL ARCHIVES");
                renderJournals(journalPool.length > 0 ? journalPool : allData);

            } catch (err) {
                console.error("加载数据失败:", err);
            }
        }

        function buildSidebarFilters() {
            const yearMap = {};
            const locations = new Set();

            allData.forEach(item => {
                const y = item.year || item.date.split('.')[0];
                const m = item.month || item.date.split('.')[1] || '01';
                if (!yearMap[y]) yearMap[y] = new Set();
                yearMap[y].add(m);

                if (item.location) locations.add(item.location);
            });

            const yearContainer = document.getElementById('yearFilterContainer');
            yearContainer.innerHTML = '';
            Object.keys(yearMap).sort().reverse().forEach(year => {
                const wrapper = document.createElement('div');
                const yBtn = document.createElement('button');
                yBtn.className = 'filter-item';
                yBtn.innerText = year;
                yBtn.onclick = () => toggleYear(year, Array.from(yearMap[year]).sort(), wrapper);
                wrapper.appendChild(yBtn);
                yearContainer.appendChild(wrapper);
            });

            const locContainer = document.getElementById('locationFilterContainer');
            locContainer.innerHTML = '';
            locations.forEach(loc => {
                const lBtn = document.createElement('button');
                lBtn.className = 'filter-item';
                lBtn.innerText = loc;
                lBtn.onclick = () => filterByLocation(loc, lBtn);
                locContainer.appendChild(lBtn);
            });
        }

        function toggleYear(year, months, wrapperElement) {
            document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());

            activeYear = year;
            event.target.classList.add('active');

            const subDiv = document.createElement('div');
            subDiv.className = 'sub-months';

            months.forEach(m => {
                const mBtn = document.createElement('button');
                mBtn.className = 'month-btn';
                mBtn.innerText = `${year}.${m}`;
                mBtn.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                    mBtn.classList.add('active');
                    filterByYearMonth(year, m);
                };
                subDiv.appendChild(mBtn);
            });

            wrapperElement.appendChild(subDiv);
            filterByYear(year);
        }

        function filterAll() {
            document.querySelectorAll('.filter-item, .month-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());
            event.target.classList.add('active');
            renderMasonry(allData, "ALL ARCHIVES");
        }

        function filterByYear(year) {
            const filtered = allData.filter(item => (item.year || item.date.split('.')[0]) === year);
            renderMasonry(filtered, `YEAR: ${year}`);
        }

        function filterByYearMonth(year, month) {
            const filtered = allData.filter(item => {
                const y = item.year || item.date.split('.')[0];
                const m = item.month || item.date.split('.')[1];
                return y === year && m === month;
            });
            renderMasonry(filtered, `PERIOD: ${year}.${month}`);
        }

        function filterByLocation(loc, btnElement) {
            document.querySelectorAll('.filter-item, .month-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-months').forEach(el => el.remove());
            btnElement.classList.add('active');

            const filtered = allData.filter(item => item.location === loc);
            renderMasonry(filtered, `LOCATION: ${loc}`);
        }

        function renderMasonry(dataArray, titleText) {
            document.getElementById('viewTitle').innerText = titleText;
            document.getElementById('viewCount').innerText = `${dataArray.length} items`;
            
            const container = document.getElementById('masonryContainer');
            container.innerHTML = '';

            dataArray.forEach(item => {
                const div = document.createElement('div');
                div.className = 'masonry-item';
                div.innerHTML = `
                    <img src="${item.url}" alt="${item.location}" class="masonry-img" onclick="openLightbox('${item.url}')">
                    <div class="masonry-meta">
                        <span>${item.location}</span>
                        <span>${item.date}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderJournals(journalData) {
            const container = document.getElementById('journalsContainer');
            container.innerHTML = '';

            journalData.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'journal-card-wrapper';
                
                // 只有当 note 有内容时才渲染文字备注部分
                let noteHtml = item.note ? `<p class="postcard-note">"${item.note}"</p>` : '';

                wrapper.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="timeline-label">${item.date}</div>
                    <div class="postcard-frame">
                        <div class="postcard-img-container">
                            <img src="${item.url}" alt="${item.location}" onclick="openLightbox('${item.url}')">
                        </div>
                        <div class="postcard-footer" ${!item.note ? 'style="border-top:none; margin-top:0.8rem;"' : ''}>
                            ${noteHtml}
                            <div class="postcard-info">
                                <span class="info-loc">${item.location}</span>
                                <span>${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        function openLightbox(url) {
            const box = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = url;
            box.style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // BGM 控制
        const audio = document.getElementById('bgmAudio');
        const bgmToggle = document.getElementById('bgmToggle');
        if (audio && bgmToggle) {
            audio.volume = 0.35;
            bgmToggle.onclick = () => {
                if (audio.paused) {
                    audio.play().then(() => {
                        bgmToggle.innerText = "SOUND: ON [Kan R. Gao - Born a Stranger]";
                    }).catch(e => console.error(e));
                } else {
                    audio.pause();
                    bgmToggle.innerText = "SOUND: Kan R. Gao - Born a Stranger";
                }
            };
        }

        window.onload = initGallery;
    </script>
</body>
</html>
